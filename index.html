      .text-gold {
        background: linear-gradient(135deg, #b45309 0%, #f59e0b 50%, #b45309 100%);

        -webkit-text-fill-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
